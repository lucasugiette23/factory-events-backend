server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: factory-events-backend
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/factory-events
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
